name: ci
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh -n install.sh
      - run: bash -n test/e2e.sh
      - run: shellcheck -S error install.sh test/e2e.sh
      - run: cp .env.example .env && docker compose config >/dev/null && rm .env

  e2e:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - run: bash test/e2e.sh
      - if: failure()
        run: cat compose.log || true
